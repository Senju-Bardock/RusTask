[package]
name = "rustask"
version = "0.1.0"
edition = "2021"
description = "A fast, lightweight, faithful recreation of the Windows 11 Task Manager"
license = "MIT"
readme = "README.md"

[dependencies]
# Official Microsoft Win32 bindings. Features will be enabled as the data layer grows.
# windows = { version = "0.58", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
